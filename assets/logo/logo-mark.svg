<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BetterShot mark">
  <!-- Canonical mark: Selection brackets + neon spark -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>

  <!-- Four corner brackets (selection frame) -->
  <!-- Top-left -->
  <path d="M14 22 L14 14 L22 14" fill="none" stroke="#00FF41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-right -->
  <path d="M42 14 L50 14 L50 22" fill="none" stroke="#00FF41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-right -->
  <path d="M50 42 L50 50 L42 50" fill="none" stroke="#00FF41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-left -->
  <path d="M22 50 L14 50 L14 42" fill="none" stroke="#00FF41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center neon spark (4-point star) -->
  <path d="M32 22 L34 30 L42 32 L34 34 L32 42 L30 34 L22 32 L30 30 Z" fill="#00FF41"/>
  <!-- Inner highlight -->
  <circle cx="32" cy="32" r="2" fill="#0A0A0A"/>
</svg>
